"]], ["New Hampshire", "Arizona", ["McCall McMullen"]], ["New Hampshire", "Cortland", ["Taylor Beers"]], ["Northern Illinois", "Western Michigan", ["Mikayla Brown"]], ["Ohio State", "Arizona", ["Karleigh Reutzel"]], ["Ohio State", "Maryland", ["Rylee Guevara"]], ["Oregon State", "Missouri", ["Jennifer McMillan"]], ["Oregon State", "Sacramento State", ["Katie Rude"]], ["Penn", "LSU", ["Skyelar Kerico"]], ["Penn State", "Clemson", ["Ava Piedrahita"]], ["Rhode Island College", "Bridgeport", ["Liz Shrewsbury"]], ["Rhode Island College", "Utica", ["Hannah Radcliff"]], ["SEMO", "Southern Connecticut", ["Genesis Bosque"]], ["SEMO", "UW-Oshkosh", ["Amaia McKinnie"]], ["San Jose State", "UW-Oshkosh", ["Brianna Baechle"]], ["Southern Connecticut", "LIU", ["Jordan Villani"]], ["Southern Connecticut", "New Hampshire", ["Maria Chronopoulos"]], ["Temple", "George Washington", ["Reese DeHaan"]], ["Temple", "New Hampshire", ["Jade Harden"]], ["UCLA", "Arizona State", ["Lauren Little"]], ["UW-Whitewater", "Cortland", ["Carly Musschoot"]], ["UW-Whitewater", "UW-Stout", ["Claire Donahue"]], ["Utah", "Auburn", ["Olivia Kennedy"]], ["Utah State", "Arkansas", ["Nyla Morabito"]], ["Utica", "Kent State", ["Emmy Graff"]], ["Washington", "Iowa", ["Caitlin McWilliams"]], ["Washington", "Utah", ["Lilly Tubbs"]], ["West Chester", "Rhode Island College", ["Sophie Salvatori"]], ["Western Michigan", "Bowling Green", ["Peyton Stanos"]], ["Wilberforce", "Greenville", ["Mya Caines", "Diamond Cook"]]]};
var schools = DATA.schools, moves = DATA.moves;
var names = Object.keys(schools);

var map = L.map("map", { minZoom: 3, maxZoom: 9 });
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
  { attribution: "Tiles &copy; Esri" }).addTo(map);

// City and state labels only appear once you zoom in (change 6 to show them sooner or later)
var LABEL_ZOOM = 6;
var labels = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}");
function updateLabels() {
  if (map.getZoom() >= LABEL_ZOOM) { if (!map.hasLayer(labels)) labels.addTo(map); }
  else if (map.hasLayer(labels)) { map.removeLayer(labels); }
}
map.on("zoomend", updateLabels);

var USA = [[24.5, -125], [49.5, -66.5]];
map.fitBounds(USA);
updateLabels();

var layer = L.layerGroup().addTo(map);
var card = document.getElementById("card");

function dot(name, color, showName) {
  var d = L.circleMarker(schools[name], { radius: 7, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1 });
  d.bindTooltip(name, { permanent: !!showName, direction: "top", offset: [0, -6], className: showName ? "name" : "" });
  d.on("click", function (e) { L.DomEvent.stopPropagation(e); show(name); });
  return d;
}

// Gentle curve so a move in each direction between two schools does not sit on top of the other
function curve(a, b) {
  var dy = b[0] - a[0], dx = b[1] - a[1], pts = [];
  var cy = (a[0] + b[0]) / 2 + dx * 0.12, cx = (a[1] + b[1]) / 2 - dy * 0.12;
  for (var i = 0; i <= 20; i++) {
    var t = i / 20, u = 1 - t;
    pts.push([u*u*a[0] + 2*u*t*cy + t*t*b[0], u*u*a[1] + 2*u*t*cx + t*t*b[1]]);
  }
  return pts;
}

// Small arrow at the middle of a line, pointing the way the gymnast moved
function arrow(pts, color) {
  var p1 = map.latLngToLayerPoint(pts[9]), p2 = map.latLngToLayerPoint(pts[11]);
  var angle = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
  var svg = '<svg width="16" height="16" viewBox="0 0 16 16" style="transform:rotate(' + angle + 'deg)">' +
            '<path d="M3 2 L14 8 L3 14 Z" fill="' + color + '" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  return L.marker(pts[10], {
    icon: L.divIcon({ html: svg, className: "", iconSize: [16, 16], iconAnchor: [8, 8] }),
    interactive: false
  });
}

function overview() {
  layer.clearLayers();
  moves.forEach(function (m) {
    L.polyline(curve(schools[m[0]], schools[m[1]]),
      { color: "#d0d0d0", weight: 1, opacity: 1, interactive: false }).addTo(layer);
  });
  names.forEach(function (n) { dot(n, "#444").addTo(layer); });
  var options = names.map(function (n) { return "<option>" + n + "</option>"; }).join("");
  card.innerHTML =
    "<h1>2026-2027 Transfers</h1>" +
    "<p>CWhere are gymnasts headed in 2026-2027? Click on a dot on the map, or pick a school below, to see its transfers heading into the 2027 season.</p>" +
    "<p>Transfers in are shown in pink and transfers out are in gray. Click anywhere to reset the map.</p>" +
    "<select id='pick'><option value=''>Choose a school...</option>" + options + "</select>";
  document.getElementById("pick").onchange = function () { if (this.value) show(this.value); };
}

function show(name) {
  layer.clearLayers();
  var PINK = "#FC0140", GRAY = "#6D6D6D";
  var to = [], from = [], toSet = {}, fromSet = {};

  moves.forEach(function (m) {
    var a = m[0], b = m[1], who = m[2], n = who.length;
    if (a === name) { to.push(b + " (" + who.join(", ") + ")"); toSet[b] = true; }
    if (b === name) { from.push(a + " (" + who.join(", ") + ")"); fromSet[a] = true; }
    if (a === name || b === name) {
      var pts = curve(schools[a], schools[b]), color = a === name ? GRAY : PINK;
      L.polyline(pts, { color: color, weight: 2 + n, opacity: 1 }).addTo(layer);
      arrow(pts, color).addTo(layer);
    }
  });

  names.forEach(function (n) {
    if (n === name) return;
    if (toSet[n] || fromSet[n]) dot(n, toSet[n] ? GRAY : PINK, true).addTo(layer);
  });
  dot(name, "#222", true).addTo(layer);

  function list(items, empty) {
    return items.length ? "<ul><li>" + items.join("</li><li>") + "</li></ul>" : "<p>" + empty + "</p>";
  }
  card.innerHTML =
    "<h1>" + name + "</h1>" +
    (!to.length && !from.length ? "<p>No transfers</p>" :
      "<h3 class='blue'>Transferred to " + name + " from:</h3>" + list(from, "No transfers in") +
      "<h3 class='red'>Transferred from " + name + " to:</h3>" + list(to, "No transfers out")) +
    "<button id='back'>&larr; Back to all schools</button>";
  document.getElementById("back").onclick = overview;
}

map.on("click", overview);
overview();
</script>
